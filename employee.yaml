    name: 文章大纲生成
    path: workflows/wf-indie-seo-outline
    version: 1.0.0
    phase: P1
    calls:
    - outline-generator
  - slug: wf-indie-seo-multilingual
    name: 多语言文章产出
    path: workflows/wf-indie-seo-multilingual
    version: 1.0.0
    phase: P1
