    path: workflows/wf-indie-seo-draft-internal-link
    version: 1.0.0
    phase: P2
    calls:
    - internal-link-matcher
  - slug: wf-indie-seo-effect-review
    name: 收录与排名监控
    path: workflows/wf-indie-seo-effect-review
    version: 1.0.0
    phase: P2
    calls:
    - rank-volatility-alert
  knowledge_base: kb/
  connectors: connectors/bindings.yaml
